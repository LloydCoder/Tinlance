name: M0 Lock Refresh Main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore(ci): remove one-time main lock refresh'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only
      - name: Verify resolved Next.js version
        run: pnpm list next --filter @tinlance/web --depth 0
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "chore(deps): refresh Next.js security lockfile"
          git push origin main
