name: P0 Lockfile Refresh

on:
  push:
    branches:
      - fix/p0-production-integrity

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore(ci): remove temporary lock refresh workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p0-production-integrity
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh web lockfile
        run: pnpm up --lockfile-only --filter @tinlance/web next@15.5.24 @next/eslint-plugin-next@15.5.24 eslint-config-next@15.5.24

      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile changes required."
            exit 0
          fi
          git commit -m "chore(deps): refresh Next.js security lockfile"
          git push origin fix/p0-production-integrity
