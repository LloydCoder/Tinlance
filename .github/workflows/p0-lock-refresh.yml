name: P0 Lockfile Refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/p0-production-integrity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/p0-production-integrity
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Refresh Next.js lockfile
        run: pnpm update --lockfile-only --filter @tinlance/web next@15.5.24

      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore(deps): refresh Next.js security lockfile"
          git push origin HEAD:fix/p0-production-integrity
