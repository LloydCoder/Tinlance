name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
        working-directory: .
      - run: rm -f pnpm-lock.yaml
        working-directory: .
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @tinlance/web test -- --passWithNoTests
        working-directory: .
      - name: Format and commit changed source and documentation files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          changed=$(git -C "$GITHUB_WORKSPACE" diff --name-only --diff-filter=ACMR "$base" "$head" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.mjs' '*.cjs')
          if [ -n "$changed" ]; then
            while IFS= read -r file; do
              pnpm exec prettier --write "$GITHUB_WORKSPACE/$file"
            done <<< "$changed"
            if ! git -C "$GITHUB_WORKSPACE" diff --quiet; then
              git -C "$GITHUB_WORKSPACE" config user.name "github-actions[bot]"
              git -C "$GITHUB_WORKSPACE" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git -C "$GITHUB_WORKSPACE" add -- $changed
              git -C "$GITHUB_WORKSPACE" commit -m "chore: apply prettier formatting [skip ci]"
              git -C "$GITHUB_WORKSPACE" push origin HEAD:"${{ github.head_ref || github.ref_name }}"
            fi
          fi
      - run: pnpm audit --audit-level=high
        working-directory: .
      - run: pnpm build
