name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinlance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tinlance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tinlance_ci?schema=public
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh patched Next.js lockfile
        if: github.ref == 'refs/heads/fix/p0-next-security'
        working-directory: .
        run: |
          pnpm update --lockfile-only --filter @tinlance/web next@15.5.24
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
          else
            git commit -m "chore(deps): refresh Next.js security lockfile"
            git push origin HEAD:fix/p0-next-security
          fi
      - run: pnpm install --frozen-lockfile=true
        working-directory: .
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @tinlance/web test -- --passWithNoTests
        working-directory: .
      - name: Check formatting for changed files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            head="${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
            head="${{ github.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$base" "$head" | grep -E '\\.(js|jsx|ts|tsx|json|css|md|mjs|cjs)$' || true)
          if [ "${#changed[@]}" -eq 0 ]; then exit 0; fi
          failed=0
          for file in "${changed[@]}"; do
            pnpm exec prettier --check --ignore-unknown "$file" || failed=1
          done
          exit "$failed"
        working-directory: .
      - run: pnpm audit --audit-level=high
        working-directory: .
      - run: pnpm build

  fde-api:
    name: FDE API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/fde-api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pip install 'ruff>=0.8,<1.0' 'pip-audit>=2.7,<3.0'
      - run: ruff check .
      - run: python -m pip check
      - run: pytest -q
      - name: Audit installed third-party dependencies
        run: |
          pip uninstall -y tinlance-fde-api
          pip-audit --strict

  ai-security-regression:
    name: AI security regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/fde-api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest -q tests/test_ai_security_regressions.py

  container-validation:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [web, fde-api]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build web image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/web/Dockerfile
          tags: tinlance-web:ci
          load: true
          provenance: false
      - name: Build FDE API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/fde-api/Dockerfile
          tags: tinlance-fde-api:ci
          load: true
          provenance: false
      - name: Validate image hardening
        run: |
          test "$(docker inspect -f '{{.Config.User}}' tinlance-web:ci)" = "nextjs"
          test "$(docker inspect -f '{{.Config.User}}' tinlance-fde-api:ci)" = "app"
          docker inspect -f '{{json .Config.Healthcheck}}' tinlance-web:ci | grep -q 'api/health'
          docker inspect -f '{{json .Config.Healthcheck}}' tinlance-fde-api:ci | grep -q '/health'
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: tinlance-web:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan FDE API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: tinlance-fde-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [container-validation]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build web image for SBOM
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/web/Dockerfile
          tags: tinlance-web:sbom
          load: true
      - name: Build FDE API image for SBOM
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: apps/fde-api/Dockerfile
          tags: tinlance-fde-api:sbom
          load: true
      - uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532
        with:
          image: tinlance-web:sbom
          format: cyclonedx-json
          output-file: tinlance-web.sbom.json
      - uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6945e0731532
        with:
          image: tinlance-fde-api:sbom
          format: cyclonedx-json
          output-file: tinlance-fde-api.sbom.json
      - name: Validate SBOM documents
        run: |
          python - <<'PY'
          import json
          for name in ('tinlance-web.sbom.json', 'tinlance-fde-api.sbom.json'):
              with open(name, encoding='utf-8') as fh:
                  data = json.load(fh)
              assert data.get('bomFormat') == 'CycloneDX', name
              assert data.get('specVersion'), name
              assert data.get('components'), name
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tinlance-sboms
          path: '*.sbom.json'
          if-no-files-found: error

  security-static:
    name: Static security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            semgrep/semgrep:1.172.0 \
            semgrep \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/python \
            --error \
            /src/apps

  enterprise-gate:
    name: Enterprise CI gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - web
      - fde-api
      - ai-security-regression
      - container-validation
      - sbom
      - security-static
    steps:
      - name: Require every blocking gate to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ['RESULTS'])
          failed = {name: value.get('result') for name, value in needs.items() if value.get('result') != 'success'}
          if failed:
              print('Failed or skipped blocking gates:', failed)
              sys.exit(1)
          print('All blocking enterprise CI gates passed:', ', '.join(sorted(needs)))
          PY
