name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinlance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tinlance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tinlance_ci?schema=public
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=true
        working-directory: .
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @tinlance/web test -- --passWithNoTests
        working-directory: .
      - name: Check formatting for changed source and documentation files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$base" "$head" | grep -E '\.(js|jsx|ts|tsx|json|css|md|mjs|cjs)$' || true)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "No supported changed files to format-check."
            exit 0
          fi

          failed=0
          for file in "${changed[@]}"; do
            if ! pnpm exec prettier --check --ignore-unknown "$file"; then
              echo "::error file=$file::Prettier check failed"
              failed=1
            fi
          done
          exit "$failed"
        working-directory: .
      - run: pnpm audit --audit-level=high
        working-directory: .
      - run: pnpm build

  fde-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/fde-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pip install 'ruff>=0.8,<1.0' 'pip-audit>=2.7,<3.0'
      - run: ruff check .
      - run: python -m pip check
      - run: pytest -q
      - name: Audit installed third-party dependencies
        run: |
          pip uninstall -y tinlance-fde-api
          pip-audit --strict

  ai-security-regression:
    name: AI security regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/fde-api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest -q tests/test_ai_security_regressions.py

  container-validation:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [web, fde-api]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: tinlance-web:ci
          load: true
          provenance: false
      - name: Build FDE API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/fde-api/Dockerfile
          tags: tinlance-fde-api:ci
          load: true
          provenance: false
      - name: Validate image hardening
        run: |
          test "$(docker inspect -f '{{.Config.User}}' tinlance-web:ci)" = "nextjs"
          test "$(docker inspect -f '{{.Config.User}}' tinlance-fde-api:ci)" = "app"
          docker inspect -f '{{json .Config.Healthcheck}}' tinlance-web:ci | grep -q 'api/health'
          docker inspect -f '{{json .Config.Healthcheck}}' tinlance-fde-api:ci | grep -q '/health'
      - name: Scan web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tinlance-web:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Scan FDE API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: tinlance-fde-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [container-validation]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - name: Build web image for SBOM
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: tinlance-web:sbom
          load: true
      - name: Build FDE API image for SBOM
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/fde-api/Dockerfile
          tags: tinlance-fde-api:sbom
          load: true
      - name: Generate web CycloneDX SBOM
        uses: anchore/sbom-action@v0.20.0
        with:
          image: tinlance-web:sbom
          format: cyclonedx-json
          output-file: tinlance-web.sbom.json
      - name: Generate FDE API CycloneDX SBOM
        uses: anchore/sbom-action@v0.20.0
        with:
          image: tinlance-fde-api:sbom
          format: cyclonedx-json
          output-file: tinlance-fde-api.sbom.json
      - name: Validate SBOM documents
        run: |
          python - <<'PY'
          import json
          for name in ("tinlance-web.sbom.json", "tinlance-fde-api.sbom.json"):
              with open(name, encoding="utf-8") as fh:
                  data = json.load(fh)
              assert data.get("bomFormat") == "CycloneDX", name
              assert data.get("specVersion"), name
              assert data.get("components"), name
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: tinlance-sboms
          path: '*.sbom.json'
          if-no-files-found: error

  security-static:
    name: Static security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            semgrep/semgrep:1.172.0 \
            semgrep \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/python \
            --error \
            /src/apps

  dependency-review:
    name: Dependency review (advisory when GitHub graph is unavailable)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Review pull request dependencies
        id: dependency-review
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - name: Dependency review fallback
        if: steps.dependency-review.outcome == 'failure'
        run: echo "GitHub Dependency Review is advisory because repository dependency graph support is unavailable; pnpm audit and pip-audit remain blocking security gates."
      - name: Dependency review not applicable to push
        if: github.event_name != 'pull_request'
        run: echo "Dependency review is PR-only; package audits run in the application gates."

  enterprise-gate:
    name: Enterprise CI gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - web
      - fde-api
      - ai-security-regression
      - container-validation
      - sbom
      - security-static
      - dependency-review
    steps:
      - name: Require every blocking gate to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          blocking = {name: value.get("result") for name, value in needs.items() if name != "dependency-review"}
          failed = {name: result for name, result in blocking.items() if result != "success"}
          if failed:
              print("Failed or skipped blocking gates:", failed)
              sys.exit(1)
          print("All blocking enterprise CI gates passed:", ", ".join(sorted(blocking)))
          PY
