name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'gate-a-enterprise-identity-v2']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

env:
  BETTER_AUTH_SECRET: tinlance-gate-a-ci-auth-secret-32-characters-minimum
  BETTER_AUTH_SCIM_CREDENTIAL_HASH_SECRET: tinlance-gate-a-ci-scim-secret-32-characters-minimum

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  web:
    name: Web application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinlance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tinlance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tinlance_ci?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=true
        working-directory: .
      - name: Validate database migrations
        run: pnpm prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @tinlance/web test -- --passWithNoTests
        working-directory: .
      - name: Check formatting for changed files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
            head="${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "merge_group" ]; then
            base="${{ github.event.merge_group.base_sha }}"
            head="${{ github.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          mapfile -t changed < <(git diff --name-only --diff-filter=ACMR "$base" "$head" | grep -E '\\.(js|jsx|ts|tsx|json|css|md|mjs|cjs)$' || true)
          if [ "${#changed[@]}" -eq 0 ]; then exit 0; fi
          failed=0
          for file in "${changed[@]}"; do
            pnpm exec prettier --check --ignore-unknown "$file" || failed=1
          done
          exit "$failed"
        working-directory: .
      - run: pnpm audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm
        working-directory: .
      - run: pnpm build

  fde-api:
    name: FDE API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/fde-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pip install 'ruff>=0.8,<1.0' 'pip-audit>=2.7,<3.0'
      - run: ruff check .
      - run: python -m pip check
      - run: pytest -q
      - name: Audit installed third-party dependencies
        run: |
          pip uninstall -y tinlance-fde-api
          pip-audit --strict

  ai-security-regression:
    name: AI security regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/fde-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest -q tests/test_ai_security_regressions.py

  m8-evaluation:
    name: M8 Agent Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinlance_m8_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tinlance_m8_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tinlance_m8_ci?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=true
        working-directory: .
      - run: pnpm prisma migrate deploy
      - run: pnpm typecheck
      - run: pnpm lint
      - name: M8 deterministic and meta-tests
        run: pnpm test -- tests/security/m8-evaluation.test.ts --passWithNoTests
      - run: pnpm build
      - run: pnpm audit --audit-level=high --ignore GHSA-vfj7-8cjw-p6xm
        working-directory: .
      - name: Secret scan current source tree
        working-directory: .
        run: |
          rm -rf /tmp/m8-secret-scan
          mkdir -p /tmp/m8-secret-scan
          rsync -a --exclude='.git' --exclude='node_modules' --exclude='.next' ./ /tmp/m8-secret-scan/
          docker run --rm -v "/tmp/m8-secret-scan:/repo:ro" zricethezav/gitleaks:v8.28.0 dir /repo --no-banner --redact --exit-code 1

  container-validation:
    name: Container validation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [web, fde-api]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/web/Dockerfile
          tags: tinlance-web:ci
          build-args: |
            BETTER_AUTH_SECRET=${{ env.BETTER_AUTH_SECRET }}
            BETTER_AUTH_SCIM_CREDENTIAL_HASH_SECRET=${{ env.BETTER_AUTH_SCIM_CREDENTIAL_HASH_SECRET }}
          load: true
          provenance: false
      - name: Build FDE API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: apps/fde-api/Dockerfile
          tags: tinlance-fde-api:ci
          load: true
          provenance: false
      - name: Validate image hardening
        run: |
          test "$(docker inspect -f '{{.Config.User}}' tinlance-web:ci)" = "nextjs"
          test "$(docker inspect -f '{{.Config.User}}' tinlance-fde-api:ci)" = "app"
          docker inspect -f '{{json .Config.Healthcheck}}' tinlance-web:ci | grep -q 'api/health'
          docker inspect -f '{{json .Config.Healthcheck}}' tinlance-fde-api:ci | grep -q '/health'
      - name: Scan web image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: tinlance-web:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - name: Verify FDE API urllib3 runtime provenance
        run: |
          docker run --rm --entrypoint python tinlance-fde-api:ci -c "import importlib.metadata as m; versions=sorted({d.version for d in m.distributions() if d.metadata.get('Name','').lower() == 'urllib3'}); assert versions == ['2.8.0'], versions"
      - name: Scan FDE API image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: tinlance-fde-api:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignorefile: .trivyignore
      - name: Generate web SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          image: tinlance-web:ci
          format: cyclonedx-json
          output-file: tinlance-web.sbom.json
          upload-artifact: false
          upload-release-assets: false
      - name: Generate FDE API SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26
        with:
          image: tinlance-fde-api:ci
          format: cyclonedx-json
          output-file: tinlance-fde-api.sbom.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tinlance-sboms
          path: |
            tinlance-web.sbom.json
            tinlance-fde-api.sbom.json
          if-no-files-found: error

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [container-validation]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: tinlance-sboms
      - name: Validate SBOM documents
        run: |
          python - <<'PY'
          import json
          for name in ('tinlance-web.sbom.json', 'tinlance-fde-api.sbom.json'):
              with open(name, encoding='utf-8') as fh:
                  data = json.load(fh)
              assert data.get('bomFormat') == 'CycloneDX', name
              assert data.get('specVersion'), name
              assert data.get('components'), name
          PY

  security-static:
    name: Static security scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Run Semgrep
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/src" \
            semgrep/semgrep:1.172.0 \
            semgrep \
            --config=p/owasp-top-ten \
            --config=p/javascript \
            --config=p/python \
            --error \
            /src/apps

  dast:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinlance_dast
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tinlance_dast"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tinlance_dast?schema=public
      BETTER_AUTH_SECRET: tinlance-dast-auth-secret-32-characters-minimum
      BETTER_AUTH_SCIM_CREDENTIAL_HASH_SECRET: tinlance-dast-scim-secret-32-characters-minimum
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.34.6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=true --prod=false
      - run: pnpm --filter @tinlance/web exec prisma migrate deploy
      - run: pnpm --filter @tinlance/web build
      - name: Start production web server
        working-directory: apps/web
        run: NODE_ENV=production pnpm exec next start -H 127.0.0.1 -p 3000 > /tmp/tinlance-next.log 2>&1 & echo $! > /tmp/tinlance-next.pid
      - name: Wait for application readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/tinlance-next.log
          exit 1
      - name: Smoke-test public FDSE routes and SEO surfaces
        run: |
          set -euo pipefail
          check_route() {
            local path="$1"
            local expected="$2"
            local body
            body="$(curl --fail --silent --show-error --location "http://127.0.0.1:3000${path}")"
            grep -Fq -- "$expected" <<<"$body"
          }
          check_route "/engineering/fdse" "Engineering intelligence and assurance"
          check_route "/engineering" "A public architecture map with a claim-to-evidence boundary."
          check_route "/fde-mastery" "FDE Mastery"
          check_route "/products" "Products with explicit evidence boundaries"
          sitemap="$(curl --fail --silent --show-error --location http://127.0.0.1:3000/sitemap.xml)"
          grep -Fq -- "https://www.tinlance.com/engineering/fdse" <<<"$sitemap"
          robots="$(curl --fail --silent --show-error --location http://127.0.0.1:3000/robots.txt)"
          grep -Fq -- "Sitemap: https://www.tinlance.com/sitemap.xml" <<<"$robots"

      - name: Run OWASP ZAP baseline scan
        run: |
          set -euo pipefail
          mkdir -p /tmp/zap
          chmod 0777 /tmp/zap
          docker run --rm --network host -v /tmp/zap:/zap/wrk:rw ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://127.0.0.1:3000 -m 5 -I -J zap-report.json -r zap-report.html -w zap-report.md
      - name: Enforce DAST risk policy
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/zap/zap-report.json').read_text(encoding='utf-8'))
          findings = []
          for site in report.get('site', []):
              for alert in site.get('alerts', []):
                  try:
                      risk = int(alert.get('riskcode', 0))
                  except (TypeError, ValueError):
                      risk = 0
                  if risk >= 2:
                      findings.append((risk, alert.get('name', 'unknown'), alert.get('pluginid', 'unknown')))
          if findings:
              print('Blocking DAST findings (risk >= medium):')
              for risk, name, plugin in findings:
                  print(f'  risk={risk} plugin={plugin} name={name}')
              raise SystemExit(1)
          print('DAST policy passed: no medium/high-risk findings; low-risk warnings remain in the evidence artifact.')
          PY

      - name: Upload DAST evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tinlance-ci-dast-evidence
          path: |
            /tmp/zap/zap-report.json
            /tmp/zap/zap-report.html
            /tmp/zap/zap-report.md
            /tmp/tinlance-next.log
          if-no-files-found: warn
      - name: Stop production web server
        if: always()
        run: |
          if [ -f /tmp/tinlance-next.pid ]; then kill "$(cat /tmp/tinlance-next.pid)" || true; fi

  production-verification:
    name: Production FDSE verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - web
      - fde-api
      - ai-security-regression
      - m8-evaluation
      - container-validation
      - sbom
      - security-static
      - dast
    steps:
      - name: Verify canonical production FDSE route
        run: |
          set -euo pipefail
          base="https://www.tinlance.com"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/fdse.html -w 'FDSE HTTP %{http_code}\n' "$base/engineering/fdse"
          grep -Fq -- "Engineering intelligence and assurance" /tmp/fdse.html
      - name: Verify canonical sitemap and robots
        run: |
          set -euo pipefail
          base="https://www.tinlance.com"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/sitemap.xml "$base/sitemap.xml"
          grep -Fq -- "https://www.tinlance.com/engineering/fdse" /tmp/sitemap.xml
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/robots.txt "$base/robots.txt"
          grep -Fq -- "Sitemap: https://www.tinlance.com/sitemap.xml" /tmp/robots.txt
      - name: Verify production canonicalization
        run: |
          set -euo pipefail
          headers="$(curl --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors -D - -o /dev/null https://tinlance.com/engineering/fdse)"
          normalized_headers="$(printf '%s\\n' "$headers" | tr -d '\\r')"
          grep -Eiq '^HTTP/[^[:space:]]+[[:space:]]+308([[:space:]]|$)' <<<"$normalized_headers"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors -o /tmp/apex-fdse.html https://tinlance.com/engineering/fdse
          grep -Fq -- "Engineering intelligence and assurance" /tmp/apex-fdse.html


  enterprise-gate:
    name: Enterprise CI gate
    if: always()
    runs-on: ubuntu-latest
    needs:
      - web
      - fde-api
      - ai-security-regression
      - m8-evaluation
      - container-validation
      - sbom
      - security-static
      - dast
      - production-verification
    steps:
      - name: Require every blocking gate to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ['RESULTS'])
          failed = {name: value.get('result') for name, value in needs.items() if value.get('result') != 'success'}
          if failed:
              print('Failed or skipped blocking gates:', failed)
              sys.exit(1)
          print('All blocking enterprise CI gates passed:', ', '.join(sorted(needs)))
          PY

