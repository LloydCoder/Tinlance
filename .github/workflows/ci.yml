name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
        working-directory: .
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm --filter @tinlance/web test -- --passWithNoTests
        working-directory: .
      - name: Temporary formatting diagnostics
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          changed=$(git diff --name-only --diff-filter=ACMR "$base" "$head" -- '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.css' '*.md' '*.mjs' '*.cjs')
          if [ -z "$changed" ]; then
            echo "No supported changed files."
          else
            printf '%s\n' "$changed" | xargs pnpm exec prettier --write
            git diff -- "$changed"
          fi
      - run: pnpm audit --audit-level=high
        working-directory: .
      - run: pnpm build

  fde-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/fde-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pip install 'ruff>=0.8,<1.0'
      - run: ruff check .
      - run: pytest -q
