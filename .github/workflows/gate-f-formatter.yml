name: Gate F Formatter (temporary)

on:
  push:
    branches: [gate-f-scale-saas-hardening]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=true
      - run: pnpm exec prettier --write apps/web/lib/usage/meter.ts apps/web/lib/usage/meter.test.ts apps/web/lib/incident-response.ts apps/web/lib/incident-response.test.ts
      - name: Commit formatting
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/lib/usage/meter.ts apps/web/lib/usage/meter.test.ts apps/web/lib/incident-response.ts apps/web/lib/incident-response.test.ts
          git commit -m "style(gate-f): format scale SaaS code"
          git push origin HEAD:gate-f-scale-saas-hardening
