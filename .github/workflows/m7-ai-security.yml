name: M7 AI security gateway

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'gate-a-enterprise-identity-v2']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

env:
  BETTER_AUTH_SECRET: tinlance-gate-a-ci-auth-secret-32-characters-minimum
  BETTER_AUTH_SCIM_CREDENTIAL_HASH_SECRET: tinlance-gate-a-ci-scim-secret-32-characters-minimum

permissions:
  contents: read

concurrency:
  group: m7-ai-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m7-security:
    name: M7 authorization, risk and AI security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tinlance_ci?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinlance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tinlance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=true
        working-directory: .
      - name: Validate database migrations
        run: pnpm prisma migrate deploy
      - name: Generate Prisma client
        run: pnpm prisma generate
      - name: M7 deterministic security tests
        run: pnpm exec vitest run lib/security-gateway/index.test.ts lib/mcp/registry.test.ts lib/mcp/policy.test.ts lib/mcp/security.test.ts lib/mcp/server.test.ts
      - name: Typecheck M7 dependencies
        run: pnpm exec tsc --noEmit
