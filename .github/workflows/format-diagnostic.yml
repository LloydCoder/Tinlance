name: Temporary formatter diagnostic

on:
  push:
    branches: [fix/post-merge-format]

permissions:
  contents: read

jobs:
  formatter-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - name: Capture canonical Prettier output
        run: |
          files=(
            apps/web/app/portal/documents/page.tsx
            apps/web/app/portal/projects/page.tsx
            apps/web/lib/auth.ts
            apps/web/lib/auth/authorization.ts
          )
          mkdir -p /tmp/canonical
          for file in "${files[@]}"; do
            mkdir -p "/tmp/canonical/$(dirname "$file")"
            pnpm exec prettier "$file" > "/tmp/canonical/$file"
          done
          tar -czf /tmp/canonical-source.tar.gz -C /tmp/canonical .
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-prettier-source
          path: /tmp/canonical-source.tar.gz
          if-no-files-found: error
