name: Temporary formatter diagnostic

on:
  push:
    branches: [fix/post-merge-format]

permissions:
  contents: read

jobs:
  formatter-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      - name: Format target files and capture canonical source
        run: |
          files=(
            apps/web/app/portal/documents/page.tsx
            apps/web/app/portal/projects/page.tsx
            apps/web/lib/auth.ts
            apps/web/lib/auth/authorization.ts
          )
          for file in "${files[@]}"; do
            pnpm exec prettier --write --ignore-unknown "$file"
          done
          mkdir -p /tmp/formatted
          for file in "${files[@]}"; do
            mkdir -p "/tmp/formatted/$(dirname "$file")"
            cp "$file" "/tmp/formatted/$file"
          done
          tar -czf /tmp/formatted-source.tar.gz -C /tmp/formatted .
      - uses: actions/upload-artifact@v4
        with:
          name: post-merge-formatted-source
          path: /tmp/formatted-source.tar.gz
          if-no-files-found: error
