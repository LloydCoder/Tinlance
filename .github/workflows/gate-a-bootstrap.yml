name: Gate A Bootstrap And Verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: gate-a-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-and-verify:
    name: Generate Better Auth schema and verify Gate A foundation
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tinlance_gate_a
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tinlance_gate_a_shadow
      BETTER_AUTH_SECRET: gate-a-ci-secret-32-characters-minimum-123456
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_API_KEY: gate-a-ci-api-key
      BETTER_AUTH_SCIM_CREDENTIAL_HASH_SECRET: gate-a-scim-credential-hash-secret-32-characters-min
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinlance_gate_a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tinlance_gate_a"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Bootstrap Prisma client for Better Auth CLI config loading
        working-directory: apps/web
        run: pnpm prisma generate
      - name: Inspect installed SCIM managed-connection contract
        run: |
          SCIM_FILE=$(find node_modules -path '*/@better-auth/scim/dist/index.mjs' | head -1)
          sed -n '7030,7070p' "$SCIM_FILE"
      - name: Inspect Prisma adapter transaction support
        run: |
          ADAPTER_FILE=$(find node_modules -path '*/@better-auth/prisma-adapter/dist/*' | head -1)
          echo "Adapter sample: $ADAPTER_FILE"
          grep -R -n -E "transaction|native" node_modules/.pnpm/@better-auth+prisma-adapter@*/node_modules/@better-auth/prisma-adapter/dist 2>/dev/null | head -120 || true
      - name: Generate Better Auth Prisma schema
        working-directory: apps/web
        run: pnpm dlx @better-auth/cli@1.4.22 generate --output prisma/better-auth.generated.prisma --yes
      - name: Merge Better Auth schema additively
        working-directory: apps/web
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const original = fs.readFileSync("prisma/schema.prisma", "utf8");
          const generated = fs.readFileSync("prisma/better-auth.generated.prisma", "utf8");

          function blocks(text) {
            const lines = text.split(/\n/);
            const out = new Map();
            for (let i = 0; i < lines.length; i++) {
              const m = lines[i].match(/^\s*(model|enum|type)\s+([A-Za-z0-9_]+)\s*\{/);
              if (!m) continue;
              const start = i;
              let depth = 0;
              for (; i < lines.length; i++) {
                depth += (lines[i].match(/\{/g) || []).length;
                depth -= (lines[i].match(/\}/g) || []).length;
                if (depth === 0) break;
              }
              out.set(m[2], { kind: m[1], lines: lines.slice(start, i + 1) });
            }
            return out;
          }

          function key(line) {
            const t = line.trim();
            if (!t || t.startsWith("//")) return null;
            if (t.startsWith("@@")) return t;
            if (/^[A-Za-z_][A-Za-z0-9_]*/.test(t)) return t.split(/\s+/)[0];
            return null;
          }

          const originalBlocks = blocks(original);
          const generatedBlocks = blocks(generated);
          let merged = original;

          for (const [name, gen] of generatedBlocks) {
            const existing = originalBlocks.get(name);
            if (!existing) {
              merged += (merged.endsWith("\n") ? "" : "\n") + gen.lines.join("\n") + "\n";
              continue;
            }

            const existingKeys = new Set(existing.lines.map(key).filter(Boolean));
            const additions = gen.lines.slice(1, -1).filter((line) => {
              const k = key(line);
              return k && !existingKeys.has(k);
            });
            if (!additions.length) continue;

            const needle = existing.lines.join("\n");
            const replacement = existing.lines.slice(0, -1).concat(additions, existing.lines.slice(-1)).join("\n");
            merged = merged.replace(needle, replacement);
            existing.lines = existing.lines.slice(0, -1).concat(additions, existing.lines.slice(-1));
            for (const line of additions) {
              const k = key(line);
              if (k) existingKeys.add(k);
            }
          }

          fs.writeFileSync("prisma/schema.prisma", merged);
          NODE
          rm -f prisma/better-auth.generated.prisma
      - name: Validate Prisma schema
        working-directory: apps/web
        run: pnpm prisma validate
      - name: Generate Prisma client
        working-directory: apps/web
        run: pnpm prisma generate
      - name: Prepare Prisma shadow database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE tinlance_gate_a_shadow' || true
      - name: Compute reviewed migration
        working-directory: apps/web
        run: |
          set -euo pipefail
          pnpm prisma migrate diff             --from-migrations prisma/migrations             --to-schema-datamodel prisma/schema.prisma             --shadow-database-url "$SHADOW_DATABASE_URL"             --script > /tmp/gate-a-identity-access.sql
          mkdir -p prisma/migrations/202609172300_gate_a_identity_access
          mv /tmp/gate-a-identity-access.sql prisma/migrations/202609172300_gate_a_identity_access/migration.sql
          if grep -Eiq '(^|[[:space:]])(DROP[[:space:]]+(TABLE|COLUMN)|TRUNCATE|DELETE[[:space:]]+FROM)' prisma/migrations/202609172300_gate_a_identity_access/migration.sql; then
            echo "Destructive SQL detected; review required."
            cat prisma/migrations/202609172300_gate_a_identity_access/migration.sql
            exit 1
          fi
      - name: Apply migration to isolated CI database
        working-directory: apps/web
        run: pnpm prisma migrate deploy
      - name: Typecheck
        working-directory: apps/web
        run: pnpm typecheck
      - name: Lint
        working-directory: apps/web
        run: pnpm lint
      - name: Tests
        working-directory: apps/web
        run: pnpm test -- --passWithNoTests
      - name: Build
        working-directory: apps/web
        run: pnpm build
      - name: Commit generated auth schema and lockfile
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json pnpm-lock.yaml apps/web/prisma/schema.prisma apps/web/prisma/migrations/202609172300_gate_a_identity_access/migration.sql .github/workflows/gate-a-bootstrap.yml apps/web/lib/auth.ts apps/web/lib/auth-client.ts 'apps/web/app/api/auth/[...all]/route.ts'
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Gate A: generate enterprise identity schema"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
