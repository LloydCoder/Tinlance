name: M4 Automation Worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m4-automation-worker
  cancel-in-progress: false

jobs:
  invoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Invoke the production automation worker
        env:
          CRON_SECRET: ${{ secrets.TINLANCE_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 320 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://tinlance.com/api/internal/automation/worker"
