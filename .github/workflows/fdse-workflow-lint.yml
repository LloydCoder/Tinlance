name: FDSE Workflow Definition Lint

on:
  push:
    branches:
      - feat/fdse-enterprise-validation-v2
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Validate FDSE enterprise workflow
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color .github/workflows/fdse-enterprise-validation.yml
