name: Cleanup Neon preview branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    name: Delete PR Neon preview branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete Neon preview branch
        uses: neondatabase/delete-branch-action@v3.1.3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: preview/${{ github.event.pull_request.head.ref }}
          api_key: ${{ secrets.NEON_API_KEY }}
