name: Repair Better Auth Prisma schema

on:
  push:
    branches: [main]
    paths:
      - apps/web/prisma/schema.prisma
      - apps/web/prisma/migrations/202609150003_better_auth_issuer/migration.sql

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Better Auth issuer fields
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/web/prisma/schema.prisma')
          s = p.read_text()
          old = '''  accountId             String\n  providerId            String\n  userId                String'''
          new = '''  accountId             String\n  providerId            String\n  issuer                String    @default("local:credential")\n  userId                String'''
          if old not in s:
              raise SystemExit('Account field anchor not found')
          s = s.replace(old, new, 1)
          old2 = '''  @@unique([providerId, accountId])\n  @@index([userId])'''
          new2 = '''  @@unique([providerId, accountId])\n  @@unique([issuer, accountId])\n  @@index([userId])'''
          if old2 not in s:
              raise SystemExit('Account index anchor not found')
          s = s.replace(old2, new2, 1)
          p.write_text(s)
          PY
      - name: Commit schema repair
        run: |
          if git diff --quiet; then
            echo 'Schema already repaired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/prisma/schema.prisma
          git commit -m 'fix(auth): align Prisma Account schema with Better Auth 1.7.1'
          git push
