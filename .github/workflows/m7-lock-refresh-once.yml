name: M7 dependency lock refresh helper
on:
  push:
    branches: [feat/m7-ai-security-gateway]
permissions:
  contents: write
jobs:
  refresh:
    if: ${{ github.event.head_commit.message != 'chore(ci): refresh dependency lockfile' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-ai-security-gateway
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only
      - name: Commit refreshed lockfile and remove helper
        run: |
          rm -f .github/workflows/m7-lock-refresh-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pnpm-lock.yaml package.json .github/workflows/m7-lock-refresh-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(ci): refresh dependency lockfile"
          git push origin HEAD:feat/m7-ai-security-gateway
