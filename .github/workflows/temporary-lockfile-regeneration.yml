name: Temporary lockfile regeneration

on:
  push:
    branches:
      - docs/forensic-overhaul-2026-10-08

permissions:
  contents: write

jobs:
  regenerate:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(ci): regenerate lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/forensic-overhaul-2026-10-08

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already current."
            exit 0
          fi
          git add pnpm-lock.yaml
          git commit -m "chore(ci): regenerate lockfile"
          git push origin HEAD:docs/forensic-overhaul-2026-10-08
