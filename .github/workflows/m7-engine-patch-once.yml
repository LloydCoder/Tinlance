name: M7 engine patch helper
on:
  push:
    branches: [feat/m7-ai-security-gateway]
  pull_request:
    branches: [main]
    types: [synchronize]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.event_name == 'pull_request' || github.event.head_commit.message != 'chore(m7): apply workflow authorization patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-ai-security-gateway
          fetch-depth: 0
      - name: Patch M4 engine
        shell: python
        run: |
          from pathlib import Path
          p = Path('apps/web/lib/automation/engine.ts')
          s = p.read_text()
          old = 'import { generateAssessmentReport } from "@/lib/workspace/report";'
          new = old + '\nimport { authorizeWorkflowStep } from "@/lib/security-gateway/workflow";'
          if new not in s:
              s = s.replace(old, new, 1)
          old_fn = '''async function loadDefinition(run: RunRow): Promise<Definition> {\n  const rows = await db.$queryRaw<Array<{ definition: Definition }>>(Prisma.sql`SELECT definition FROM "automation_playbook_versions" WHERE id=${run.playbook_version_id}`);\n  if (!rows[0]) throw new Error("workflow definition missing");\n  return rows[0].definition;\n}'''
          new_fn = '''async function loadDefinition(run: RunRow): Promise<Definition> {\n  const rows = await db.$queryRaw<Array<{ definition: Definition }>>(Prisma.sql`SELECT definition FROM "automation_playbook_versions" WHERE id=${run.playbook_version_id}`);\n  if (!rows[0]) throw new Error("workflow definition missing");\n  const definition = rows[0].definition;\n  const step = definition.steps[run.current_step];\n  if (step && run.initiating_actor_user_id) {\n    const decision = await authorizeWorkflowStep({\n      organizationId: run.organization_id,\n      actorUserId: run.initiating_actor_user_id,\n      action: `workflow.step.${step.key}`,\n      resourceType: step.type === "FDE" ? "FDECapability" : "WorkflowStep",\n      resourceId: step.capabilityId ?? run.id,\n      requestId: run.request_id,\n      stepKey: step.key,\n    });\n    if (decision.decision !== "ALLOW") throw new Error(`M7_WORKFLOW_${decision.decision}:${decision.reasonCode}`);\n  } else if (step && !run.initiating_actor_user_id) {\n    throw new Error("M7_WORKFLOW_DENY:WORKFLOW_ACTOR_REQUIRED");\n  }\n  return definition;\n}'''
          if old_fn not in s:
              raise SystemExit('expected loadDefinition function not found')
          s = s.replace(old_fn, new_fn, 1)
          p.write_text(s)
      - name: Commit patch and remove helper
        run: |
          rm -f .github/workflows/m7-engine-patch-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/web/lib/automation/engine.ts .github/workflows/m7-engine-patch-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore(m7): apply workflow authorization patch"
          git push origin HEAD:feat/m7-ai-security-gateway
