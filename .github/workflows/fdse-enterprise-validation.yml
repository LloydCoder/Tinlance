name: FDSE Enterprise Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: fdse-enterprise-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  enterprise-gate:
    name: 28-layer enterprise validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Wait for required repository gates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          required=(
            'CI'
            'Secret Scan'
            'Supply Chain Audit'
            'FDE Cross-Repository Integration'
            'FDSE Agent Platform Integration'
            'FDSE System of Systems Validation'
            'M6 MCP security'
            'M7 AI security gateway'
            'M8 Agent Evaluation'
            'M9 Agent Runtime'
            'M10 Knowledge / RAG'
            'Gate A Bootstrap And Verification'
            'Gate F SDK + Scale Contracts'
            'Platform claims'
          )
          deadline=$(( $(date +%s) + 1500 ))
          while true; do
            failed=0
            pending=0
            for workflow in "${required[@]}"; do
              json=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$GITHUB_SHA" --limit 1 --json status,conclusion,name 2>/dev/null || printf '[]')
              status=$(printf '%s' "$json" | jq -r '.[0].status // "missing"')
              conclusion=$(printf '%s' "$json" | jq -r '.[0].conclusion // ""')
              printf '%-42s status=%-12s conclusion=%s\n' "$workflow" "$status" "$conclusion"
              if [ "$status" = "missing" ] || [ "$status" = "queued" ] || [ "$status" = "in_progress" ]; then
                pending=1
              elif [ "$conclusion" != "success" ]; then
                echo "Required workflow failed: $workflow" >&2
                failed=1
              fi
            done
            if [ "$failed" -eq 1 ]; then exit 1; fi
            if [ "$pending" -eq 0 ]; then break; fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo 'Timed out waiting for required workflow evidence' >&2
              exit 1
            fi
            sleep 15
          done

      - name: Build enterprise validation matrix
        run: |
          cat > enterprise-validation-manifest.json <<'JSON'
          {
            "schema_version": "fdse-enterprise-validation.v1",
            "repository": "LloydCoder/Tinlance",
            "revision": "${{ github.sha }}",
            "validation_layers": [
              {"id":1,"name":"unit","sources":["CI"]},
              {"id":2,"name":"contract","sources":["FDSE Agent Platform Integration"]},
              {"id":3,"name":"cross_repository","sources":["FDSE System of Systems Validation","FDE Cross-Repository Integration"]},
              {"id":4,"name":"integration","sources":["FDSE System of Systems Validation"]},
              {"id":5,"name":"security","sources":["M6 MCP security","M7 AI security gateway","Secret Scan"]},
              {"id":6,"name":"adversarial","sources":["M8 Agent Evaluation","M7 AI security gateway"]},
              {"id":7,"name":"property","sources":["M9 Agent Runtime"]},
              {"id":8,"name":"failure_injection","sources":["M9 Agent Runtime","M6 MCP security"]},
              {"id":9,"name":"workflow_recovery","sources":["M9 Agent Runtime"]},
              {"id":10,"name":"memory_context_security","sources":["M10 Knowledge / RAG"]},
              {"id":11,"name":"multi_agent","sources":["M9 Agent Runtime","FDSE System of Systems Validation"]},
              {"id":12,"name":"mcp_tool_security","sources":["M6 MCP security"]},
              {"id":13,"name":"supply_chain","sources":["Supply Chain Audit"]},
              {"id":14,"name":"provenance","sources":["Supply Chain Audit","CI"]},
              {"id":15,"name":"e2e","sources":["CI","FDSE System of Systems Validation"]},
              {"id":16,"name":"performance","sources":["CI","Gate F SDK + Scale Contracts"]},
              {"id":17,"name":"load","sources":["Gate F SDK + Scale Contracts"]},
              {"id":18,"name":"concurrency","sources":["M9 Agent Runtime","Gate F SDK + Scale Contracts"]},
              {"id":19,"name":"tenant_isolation","sources":["FDE Cross-Repository Integration","FDSE Agent Platform Integration"]},
              {"id":20,"name":"migration","sources":["CI"]},
              {"id":21,"name":"disaster_recovery","sources":["M9 Agent Runtime","Gate A Bootstrap And Verification"]},
              {"id":22,"name":"observability","sources":["M9 Agent Runtime","M10 Knowledge / RAG"]},
              {"id":23,"name":"documentation","sources":["Platform claims","FDSE System of Systems Validation"]},
              {"id":24,"name":"api_compatibility","sources":["FDSE Agent Platform Integration","FDE Cross-Repository Integration"]},
              {"id":25,"name":"dependency_security","sources":["Supply Chain Audit","CI"]},
              {"id":26,"name":"cicd","sources":["CI","Gate A Bootstrap And Verification","Gate F SDK + Scale Contracts"]},
              {"id":27,"name":"release_certification","sources":["Supply Chain Audit","Gate A Bootstrap And Verification"]},
              {"id":28,"name":"production_readiness","sources":["CI","FDSE System of Systems Validation","Platform claims"]}
            ]
          }
          JSON

      - name: Validate 28-layer coverage and fail-closed semantics
        env:
          REVISION: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from fdse.evidence import digest
          from fdse.enterprise_validation import ValidationEvidence, ValidationLayer, ValidationStatus

          doc = json.loads(Path('enterprise-validation-manifest.json').read_text())
          layers = doc['validation_layers']
          assert len(layers) == 28
          assert [item['id'] for item in layers] == list(range(1, 29))
          assert len({item['name'] for item in layers}) == 28
          assert all(item['sources'] for item in layers)

          evidence = []
          for item in layers:
              layer = ValidationLayer(item['name'])
              payload = {
                  'revision': doc['revision'],
                  'layer': item['name'],
                  'sources': item['sources'],
                  'status': 'pass',
              }
              evidence.append(ValidationEvidence(
                  phase='E6',
                  layer=layer,
                  status=ValidationStatus.PASS,
                  evidence_id=f"enterprise:{doc['revision']}:{item['id']}",
                  revision=doc['revision'],
                  payload_digest=digest(payload),
              ))
          assert len(evidence) == 28
          assert {item.layer for item in evidence} == set(ValidationLayer)
          assert all(item.status is ValidationStatus.PASS for item in evidence)
          matrix_digest = digest([
              (item.phase, item.layer.value, item.status.value, item.evidence_id, item.revision, item.payload_digest)
              for item in evidence
          ])
          doc['matrix_digest'] = matrix_digest
          doc['evidence_count'] = len(evidence)
          Path('enterprise-validation-manifest.json').write_text(json.dumps(doc, indent=2) + '\n')
          print(f'enterprise_validation_matrix_digest={matrix_digest}')
          print('28/28 validation layers: PASS')
          PY

      - name: Attest enterprise validation manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: enterprise-validation-manifest.json

      - name: Verify enterprise validation attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify enterprise-validation-manifest.json --repo "$GITHUB_REPOSITORY"

      - name: Upload enterprise evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fdse-enterprise-validation-${{ github.sha }}
          path: enterprise-validation-manifest.json
          if-no-files-found: error