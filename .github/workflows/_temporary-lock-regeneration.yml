name: Regenerate lockfile (temporary)

on:
  push:
    branches:
      - fix/production-readiness-dast-2026-09-27

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 10.14.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore: regenerate pnpm lockfile"
          git push origin HEAD:fix/production-readiness-dast-2026-09-27
