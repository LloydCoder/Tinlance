name: Workflow Health

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-health:
    name: Workflow health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Verify required repository contracts
        run: |
          set -euo pipefail
          test -f .github/workflows/ci.yml
          test -f pnpm-lock.yaml
          test -f package.json
          test -f apps/web/package.json
          test -f apps/fde-api/pyproject.toml
      - name: Validate workflow YAML
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; Dir[".github/workflows/*.yml"].each { |path| YAML.load_file(path); puts "validated #{path}" }'
