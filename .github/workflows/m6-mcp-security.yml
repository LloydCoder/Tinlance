name: M6 MCP security

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m6-mcp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-security:
    name: MCP security and protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tinlance_ci?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tinlance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tinlance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.14.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile=true
        working-directory: .
      - name: Validate database migrations
        run: pnpm prisma migrate deploy
      - name: Run MCP security and protocol tests
        run: pnpm exec vitest run lib/mcp/registry.test.ts lib/mcp/policy.test.ts lib/mcp/security.test.ts lib/mcp/server.test.ts
      - name: Verify MCP package is the official v2 server SDK
        run: pnpm list @modelcontextprotocol/server --depth 0
