name: Bug report
description: Report a reproducible defect in the Tinlance repository.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, credentials, customer data, or security-sensitive exploit details.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: What is broken?
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Exact commit SHA where the problem occurs.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web application
        - FDE API
        - API platform
        - Customer workspace
        - MCP / agent security
        - Documentation
        - CI / security
        - SDK
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest reliable reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Node/pnpm, Python, browser, deployment, or other relevant versions.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact secrets, tokens, personal data, and customer identifiers.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I have not included secrets or private customer data.
          required: true
        - label: This is not a security vulnerability requiring private disclosure.
          required: true
